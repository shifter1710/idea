services:
  athletics-web:
    build:
      context: .
    container_name: athletics-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./world_athletics_scoring_tables_2025.pdf:/app/world_athletics_scoring_tables_2025.pdf:ro
      - ./world_athletics_scoring_2025.json:/app/world_athletics_scoring_2025.json
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
